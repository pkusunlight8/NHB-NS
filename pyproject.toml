[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-lowradiance-comparisons"
version = "0.2.0"
description = "Core analysis for functional life expectancy and low-radiance urban comparisons"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Zhenchao Wu"}, {name = "Taikang Yao"}, {name = "Ning Shen"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "numba>=0.59"]

[project.urls]
Repository = "https://github.com/pkusunlight8/NHB-NS"

[project.scripts]
lowradiance = "lowradiance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
